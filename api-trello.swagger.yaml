    #       description: Update column successfully
    #       content:
    #         application/json:
    #           schema:
    #             $ref: "#/components/schemas/CreateColumnResponse"
    #     '422':
    #       description: Validation exception
    #       content:
    #         application/json:
    #           schema:
    #             $ref: "#/components/schemas/UnprocessableEntityError"
    #   security:
    #     - BearerAuth: []
    delete:
      tags:
        - Column
      summary: Delete a column by columnId
      description: Delete a column by columnId.
      operationId: deleteColumnById
      parameters:
        - name: columnId
          in: path
          required: true
          description: The ID of the column to delete
          schema:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Delete column successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Column deleted successfully
        '422':
          description: Column not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
  /cards:
    post:
      tags:
        - Card
      summary: Create a new card
      description: Create a new card.
      operationId: createCard
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardBody"
        required: true
      responses:
        '201':
          description: Create card successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCardResponse"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
  /cards/{cardId}:
    get:
      tags:
        - Card
      summary: Get a card by cardId
      description: Get a card by cardId.
      operationId: getCardById
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card to retrieve
          schema:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Get card successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        '422':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
    # put:
    #   tags:
    #     - Card
