openapi: 3.0.4
info:
  title: Trello API Documentation
  description: |-
    This backend project is designed to support a Trello-like task management system, handling user authentication, board and list management, task assignments, and real-time updates.
    Some useful links:
    - [Trello API repository](https://github.com/minhuy206/trello-api)
  contact:
    email: forwork@minhuy.dev
  version: 1.0.0
servers:
  - url: http://localhost:8017/v1
    description: Local server
  - url: https://api-trello.minhuy.dev/v1
    description: Production server
tags:
  - name: User
    description: User management, authentication, and authorization
  - name: Board
    description: Board management
  - name: Column
    description: Column management
  - name: Card
    description: Card management
  - name: Comment
    description: Comment management
  - name: Invitation
    description: Invitation management
paths:
  /users/register:
    post:
      tags:
        - User
      summary: Register a new user
      description: Create a new user.
      operationId: registerUser
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
        required: true
      responses:
        '201':
          description: Register successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
  /users/login:
    post:
      tags:
        - User
      summary: Login a user
      description: Login a user.
      operationId: loginUser
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
        required: true
      responses:
        '201':
          description: Login successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
  /users/logout:
    post:
      tags:
        - User
      summary: Logout a user
      description: Logout a user.
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '201':
          description: Logout successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successfully
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
  /users/send-otp:
    post:
      tags:
        - User
      summary: Send OTP
      description: Send OTP to the user. This could be used for registration.
      operationId: sendOtp
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOTPBody"
        required: true
      responses:
        '201':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP has been sent to your email    
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
  /users/refresh-token:
    post:
      tags:
        - User
      summary: Refresh access token
      description: Refresh access token using refresh token.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '201':
          description: Refresh token successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
  /users/forgot-password:
    post:
      tags:
        - User
      summary: Forgot password
      description: Send an email to password.
      operationId: forgotPassword
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
        required: true
      responses:
        '201':
          description: An email has been sent to reset password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reset password link has been sent to your email
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
  /users/reset-password:
    post:
      tags:
        - User
      summary: Reset password
      description: Reset password using OTP.
      operationId: resetPassword
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
        required: true
      responses:
        '201':
          description: Password has been changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password has been changed successfully
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
  /users/verify:
    put:
      tags:
        - User
      summary: Verify user
      description: Verify user with OTP.
      operationId: verifyUser
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyBody"
        required: true
      responses:
        '201':
          description: User verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /boards:
    get:
      tags:
        - Board
      summary: Get all boards
      description: Get all boards.
      operationId: getAllBoards
      parameters: []
      responses:
        '200':
          description: Get all boards successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
                  totalBoards:
                    type: integer
                    example: 10
      security:
        - BearerAuth: []
    post:
      tags:
        - Board
      summary: Create a new board
      description: Create a new board.
      operationId: createBoard
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardBody"
        required: true
      responses:
        '201':
          description: Create board successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBoardResponse"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
  /boards/{boardId}:
    get:
      tags:
        - Board
      summary: Get a board by boardId
      description: Get a board by boardId.
      operationId: getBoardById
      parameters:
        - name: boardId
          in: path
          required: true
          description: The ID of the board to retrieve
          schema:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Get board successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        '422':
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
    put:
      tags:
        - Board
      summary: Update a board by boardId
      description: Update a board by boardId.
      operationId: updateBoardById
      parameters:
        - name: boardId
          in: path
          required: true
          description: The ID of the board to update
          schema:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardBody"
        required: true
      responses:
        '201':
          description: Update board successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBoardResponse"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
  /columns:
    post:
      tags:
        - Column
      summary: Create a new column
      description: Create a new column.
      operationId: createColumn
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColumnBody"
        required: true
      responses:
        '201':
          description: Create column successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateColumnResponse"
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
  /columns/{columnId}:
    get:
      tags:
        - Column
      summary: Get a column by columnId
      description: Get a column by columnId.
      operationId: getColumnById
      parameters:
        - name: columnId
          in: path
          required: true
          description: The ID of the column to retrieve
          schema:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Get column successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        '422':
          description: Column not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
    # put:
    #   tags:
    #     - Column
    #   summary: Update a column by columnId
    #   description: Update a column by columnId.
    #   operationId: updateColumnById
    #   parameters:
    #     - name: columnId
    #       in: path
    #       required: true
    #       description: The ID of the column to update
    #       schema:
    #         type: string
    #         format: ObjectId
    #         example: 507f1f77bcf86cd799439011
    #   requestBody:
    #     content:
    #       application/json:
    #         schema:
    #           $ref: "#/components/schemas/CreateColumnResponse"
    #     required: true
    #   responses:
