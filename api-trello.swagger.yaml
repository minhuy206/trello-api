    #       description: Update card successfully
    #       content:
    #         application/json:
    #           schema:
    #             $ref: "#/components/schemas/CreateCardResponse"
    #     '422':
    #       description: Validation exception
    #       content:
    #         application/json:
    #           schema:
    #             $ref: "#/components/schemas/UnprocessableEntityError"
    #   security:
    #     - BearerAuth: []
    delete:
      tags:
        - Card
      summary: Delete a card by cardId
      description: Delete a card by cardId.
      operationId: deleteCardById
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card to delete
          schema:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Delete card successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Card deleted successfully
        '422':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
      security:
        - BearerAuth: []
components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          example: email@example.com
        username:
          type: string
          example: username
        displayName:
          type: string
          example: 'Your display name'
        avatar:
          type: string
          example: https://example.com/avatar.jpg
        role:
          $ref: "#/components/schemas/Role"
        isVerified:
          type: boolean
          example: true   
        createdAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        _destroy:
          type: boolean
          example: false
    RegisterBody: 
      type: object
      properties:
        email:
          type: string
          example: email@example.com
        username:
          type: string
          example: username
        password:
          type: string
          example: '12345678a'
        confirmPassword:
          type: string
          example: '12345678a'
    LoginBody:
      type: object
      required:
        - email | username
        - password
      properties:
        email:
          type: string
          example: email@example.com
        username:
          type: string
          example: username
        password:
          type: string
          example: '12345678a'
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
        refreshToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
        user: 
          $ref: "#/components/schemas/User"
    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
        refreshToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
    VerifyBody:
      type: object
      properties:
        email:
          type: string
          example: email@example.com
        code:
          type: string
          example: '123456'
    SendOTPBody:
      type: object
      properties:
        email: 
          type: string
          example: email@example.com
    ForgotPasswordBody: 
      type: object
      required:
        - email | username
      properties:
        email:
          type: string
          example: email@example.com
        username: 
          type: string
          example: username
    ResetPasswordBody:
      type: object
      properties:
        email:
          type: string
          example: '12345678a'
        password:
          type: string
          example: '12345678a'
        confirmPassword:
          type: string
          example: '12345678a'
        token:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
    UpdateUserBody:
        type: object
        properties:
          displayName:
            type: string
            example: 'Your display name'
          currentPassword:
            type: string
            example: '12345678a'
          newPassword:
            type: string
            example: '12345678a'
    Board:
      type: object
      properties:
        _id:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          example: 'Board title'
        description:
          type: string
          example: 'Board description'
        type:
          $ref: "#/components/schemas/BoardType"
        memberIds:
          type: array
          items:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        createdById:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        createdAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        _destroy:
          type: boolean
          example: false
    CreateBoardBody:
      type: object
      properties:
        title:
          type: string
          example: 'Board title'
        description:
          type: string
          example: 'Board description'
        type:
          $ref: "#/components/schemas/BoardType"
    CreateBoardResponse:
      type: object
      properties:
        _id:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          example: 'Board title'
        description:
          type: string
          example: 'Board description'
        type:
          $ref: "#/components/schemas/BoardType"
        memberIds:
          type: array
          items:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
        columnOrderIds:
          type: array
          items:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
        createdById:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        createdAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        _destroy:
          type: boolean
          example: false
    Column: 
      type: object
      properties:
        _id:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          example: 'Column title'
        boardId:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        createdById:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        createdAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
    CreateColumnBody:
      type: object
      properties:
        title:
          type: string
          example: 'Column title'
        boardId:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
    CreateColumnResponse: 
      type: object
      properties:
        _id:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          example: 'Column title'
        boardId:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        cardOrderIds:
          type: array
          items:
            type: string
            format: ObjectId
            example: 507f1f77bcf86cd799439011
        createdById:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        createdAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
    Card:
      type: object
      properties:
        _id:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          example: 'Card title'
        description:
          type: string
          example: 'Card description'
        cover:
          type: string
          example: 'https://example.com/cover.jpg'
        boardId:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        columnId:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        createdById:
          type: string
          format: ObjectId
          example: 507f1f77bcf86cd799439011
        createdAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: ISO8601
          example: '2023-10-01T12:00:00Z'
    CreateCardBody:
      type: object
      properties:
        title:
          type: string
          example: 'Card title'
        description:
          type: string
          example: 'Card description'
