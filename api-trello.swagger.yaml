    #   description: Update a card by cardId.
    #   operationId: updateCardById
    #   parameters:
    #     - name: cardId
    #       in: path
    #       required: true
    #       description: The ID of the card to update
    #       schema:
    #         type: string
    #         format: ObjectId
    #         example: 507f1f77bcf86cd799439011
    #   requestBody:
